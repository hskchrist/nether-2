name: Compilar el mod

# Se ejecuta al subir el proyecto a GitHub o al pulsar "Run workflow" en la pestaña Actions.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar
        run: gradle build --no-daemon --stacktrace

      - name: Subir el .jar del mod
        uses: actions/upload-artifact@v4
        with:
          name: civilizacion_nether-jar
          path: build/libs/*.jar
